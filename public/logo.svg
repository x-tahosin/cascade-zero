<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 38" fill="none" width="36" height="32">
  <defs>
    <!-- Gradient for outer top bar and chevron -->
    <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gradient for inner chevron -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Gradient for bottom 3D bevel / facet -->
    <linearGradient id="bottomFacetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Accent spark gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Outer Layer C-Shape -->
  <path d="M 38 2 L 15 2 L 2 17 L 15 32 L 24 32 L 20 28 L 13 28 L 6 17 L 13 6 L 38 6 Z" fill="url(#outerGrad)" />

  <!-- Inner Concentric Chevron -->
  <path d="M 36 9 L 17 9 L 8 18 L 18 28 L 22 28 L 12 18 L 17 13 L 36 13 Z" fill="url(#innerGrad)" />

  <!-- Accent Spark / Leaf in the aperture -->
  <path d="M 26 27 C 27 25 30 20 34 18 C 34 20 32 24 28 28 Z" fill="url(#sparkGrad)" />

  <!-- Bottom 3D Shaded Isometric Facet -->
  <polygon points="18,31 38,31 35,36 15,36" fill="url(#bottomFacetGrad)" />
  <line x1="18" y1="31" x2="38" y2="31" stroke="#34d399" stroke-width="0.8" opacity="0.6" />
</svg>
